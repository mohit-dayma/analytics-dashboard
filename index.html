<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pulse is a demo analytics dashboard built with React, TypeScript and Vite as a portfolio project."
    />
    <title>Pulse — Analytics dashboard</title>
    <script>
      // Resolve the theme before first paint to avoid a flash of the wrong theme.
      (() => {
        const t = localStorage.getItem("pulse-theme") ?? "system";
        const dark =
          t === "dark" ||
          (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
